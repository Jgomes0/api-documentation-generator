openapi: 3.0.3
info:
  title: Inheritance API
  version: 1.0.0
paths: {}
components:
  schemas:
    PersonFields:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonFields'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int32
            nickname:
              type: string